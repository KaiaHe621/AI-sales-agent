spring:
  application:
    name: jc-voice-shopping
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:5432/jc_voice_shopping
    username: ${PG_USERNAME}
    password: ${PG_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Shanghai
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 3
  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false
      key-prefix: "vs:cache:"

# AgentScope + DashScope
agentscope:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY}
    model-name: qwen-max

# 项目自定义配置
voice-shopping:
  llm:
    main-model: qwen-max            # 主对话模型
    light-model: qwen-turbo         # 意图/情感等轻量任务
  embedding:
    model: text-embedding-v3
    dim: 1024
  vector:
    # pgvector 跟随 datasource 所在的那个 PG，实例即 DB 里的 vector 扩展
    # 没有独立的连接参数；默认参数：
    product-topk: 20
    faq-threshold: 0.75
  voice:
    asr-model: paraformer-realtime-v2
    tts-model: cosyvoice-v1
    tts-voice: longwan           # 音色：温柔女声
  session:
    ttl-minutes: 30
    max-history-turns: 10
  compliance:
    sensitive-word-file: classpath:compliance/sensitive-words.txt
    absolute-claim-patterns: "最好,第一,保证,绝对"
  perspective:
    enabled: true

# Sa-Token
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000              # 30 天
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: false
  is-log: false

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: jc-voice-shopping

# 日志
logging:
  level:
    com.jichi.voiceshopping: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8080