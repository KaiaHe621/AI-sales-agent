server:
  port: 8085

langchain4j:
  open-ai:
    # base-url 必须写在每个子节点下，顶层写不生效（Starter 不读）
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY}   # 从环境变量读，不要硬编码
      model-name: qwen3-max
      temperature: 0.7
      max-tokens: 2048
    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY}
      model-name: qwen3-max
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/jc-ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update   # 开发环境自动建表，生产改为 validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
