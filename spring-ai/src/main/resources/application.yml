spring:
  ai:
    openai:
      # 如果用 DeepSeek，改成 https://api.deepseek.com
      # 如果用 OpenAI，改成 https://api.openai.com（或者不填，默认就是这个）
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}  # 从环境变量读取，不要直接写在配置文件里
      chat:
        options:
          model: deepseek-chat        # DeepSeek-V3 的模型名
          temperature: 0.7        # 创意度，0-2，越高越随机
          max-tokens: 2048        # 最大输出 Token 数
          top-p: 1.0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}   # 如果 Redis 设了密码就打开这行
      database: 0
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/jc-ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none        # 生产用 none，表结构手动建
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
  mail:
    host: smtp.qq.com          # QQ 邮箱，其他邮箱按实际改
    port: 465
    username: your@qq.com
    password: your_smtp_token  # QQ 邮箱的授权码，不是登录密码
    properties:
      mail:
        smtp:
          ssl:
            enable: true
server:
  port: 8082
logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG