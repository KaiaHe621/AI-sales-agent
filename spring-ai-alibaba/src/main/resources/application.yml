spring:
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:5432/vectordb
    username: postgres
    password: ${PG_PASSWORD}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}   # 从环境变量读取
      embedding:
        options:
          model: text-embedding-v3  # 通义 Embedding 模型
      chat:
        options:
          model: qwen3-max             # 默认使用 qwen-max
          temperature: 0.7
          max-tokens: 2048
    vectorstore:
      pgvector:
        initialize-schema: true          # 自动建向量表，第一次启动后可关掉
        index-type: HNSW                 # HNSW 索引，查询速度快
        distance-type: COSINE_DISTANCE   # 余弦相似度
        dimensions: 1024                 # text-embedding-v3 的向量维度是 1024，别填错，填错了报错很难排查
    # 主力：DeepSeek（便宜）
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
  autoconfigure:
    exclude:
      - org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
  threads:
    virtual:
      enabled: true  # Spring MVC 请求线程自动使用虚拟线程
server:
  port: 8083
logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
app:
  ai:
    default-provider: deepseek   # 改这一行切换全局默认
    providers:
      deepseek:
        model: deepseek-chat
      qwen:
        model: qwen-plus
resilience4j:
  circuitbreaker:
    instances:
      aiService:
        sliding-window-size: 10           # 统计最近 10 次调用
        failure-rate-threshold: 50        # 失败率超过 50% 触发熔断
        wait-duration-in-open-state: 30s  # 熔断后等待 30s 再尝试半开
        permitted-number-of-calls-in-half-open-state: 3  # 半开状态测试 3 次
  retry:
    instances:
      aiService:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException